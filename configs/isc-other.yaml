---
# oc-mirror -c ./isc.yaml --workspace file:///${PWD}/scratch/oc-mirror docker://registry:5000 --v2 --image-timeout 60m
kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
mirror:
  operators:
    - catalog: registry.redhat.io/redhat/community-operator-index:v4.20
      packages:
        - name: group-sync-operator
          defaultChannel: alpha
          # minVersion: 0.0.36
          # maxVersion: 0.0.36
    - catalog: registry.redhat.io/redhat/certified-operator-index:v4.20
      packages:
        - name: dell-csm-operator-certified
          defaultChannel: stable
          minVersion: 1.11.2
          # maxVersion: 1.11.2