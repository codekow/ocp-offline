---
# oc-mirror -c ./isc.yaml --workspace file:///${PWD}/scratch/oc-mirror docker://registry:5000 --v2 --image-timeout 60m
kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
mirror:
  operators:
    - catalog: registry.redhat.io/redhat/redhat-operator-index:v4.20
      packages:
        - name: advanced-cluster-management
          defaultChannel: release-2.16
          minVersion: 2.16.0
          # maxVersion: 2.16.0
        - name: cincinnati-operator
          defaultChannel: v1
          minVersion: 5.0.3
          maxVersion: 5.0.3
        - name: cluster-kube-descheduler-operator
          defaultChannel: stable
          minVersion: 5.3.2
          # maxVersion: 5.3.2
        - name: devworkspace-operator
          defaultChannel: fast
          minVersion: 0.39.0
          # maxVersion: 0.39.0
        - name: fence-agents-remediation
          defaultChannel: stable
          minVersion: 0.6.1
          # maxVersion: 0.6.1
        - name: local-storage-operator
          defaultChannel: stable
          minVersion: 4.20.0-202602091941
          maxVersion: 4.20.0-202602091941
        - name: kubevirt-hyperconverged
          defaultChannel: stable
          minVersion: 4.20.7
          maxVersion: 4.20.7
        - name: mtc-operator
          defaultChannel: release-v1.8
          # minVersion: 1.8.14
          # maxVersion: 1.8.14
        - name: mtv-operator
          defaultChannel: release-v2.11
          # minVersion: 2.11.1
          # maxVersion: 2.11.1
        - name: kubernetes-nmstate-operator
          defaultChannel: stable
          minVersion: 4.20.0-202602261925
          maxVersion: 4.20.0-202602261925
        - name: metallb-operator
          defaultChannel: stable
          minVersion: 4.20.0-202602261925
          # maxVersion: 4.20.0-202602261925
        - name: multicluster-engine
          defaultChannel: stable-2.11
          minVersion: 2.11.0
          # maxVersion: 2.11.0
        - name: node-healthcheck-operator
          defaultChannel: stable
          minVersion: 0.10.3
          # maxVersion: 2.16.0
        - name: node-maintenance-operator
          defaultChannel: stable
          minVersion: 0.10.3
          # maxVersion: 0.10.3
        - name: redhat-oadp-operator
          defaultChannel: stable
          minVersion: 1.5.5
          # maxVersion: 1.5.5
        - name: self-node-remediation
          defaultChannel: stable
          minVersion: 0.11.1
          maxVersion: 0.11.1
        - name: web-terminal
          defaultChannel: fast
          minVersion: 1.15.0
          maxVersion: 1.15.0
