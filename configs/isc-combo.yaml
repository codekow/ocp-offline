---
# oc-mirror -c ./isc.yaml --workspace file:///${PWD}/scratch/oc-mirror docker://registry:5000 --v2 --image-timeout 60m
kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
mirror:
  platform:
    channels:
      - name: stable-4.20
        type: ocp
        minVersion: 4.20.15
        maxVersion: 4.20.15
    graph: true
  operators:
    - catalog: registry.redhat.io/redhat/redhat-operator-index:v4.20
      packages:
        - name: advanced-cluster-management
          defaultChannel: release-2.16
          minVersion: 2.16.0
          # maxVersion: 2.16.0
        - name: cincinnati-operator
          defaultChannel: v1
          minVersion: 5.0.3
          maxVersion: 5.0.3
        - name: cluster-kube-descheduler-operator
          defaultChannel: stable
          minVersion: 5.3.2
          # maxVersion: 5.3.2
        - name: devworkspace-operator
          defaultChannel: fast
          minVersion: 0.39.0
          # maxVersion: 0.39.0
        - name: fence-agents-remediation
          defaultChannel: stable
          minVersion: 0.6.1
          # maxVersion: 0.6.1
        - name: local-storage-operator
          defaultChannel: stable
          minVersion: 4.20.0-202602091941
          maxVersion: 4.20.0-202602091941
        - name: kubevirt-hyperconverged
          defaultChannel: stable
          minVersion: 4.20.7
          maxVersion: 4.20.7
        - name: mtc-operator
          defaultChannel: release-v1.8
          minVersion: 1.8.14
          maxVersion: 1.8.14      
        - name: mtv-operator
          defaultChannel: release-v2.11
          minVersion: 2.11.1
          maxVersion: 2.11.1    
        - name: kubernetes-nmstate-operator
          defaultChannel: stable
          minVersion: 4.20.0-202602261925
          maxVersion: 4.20.0-202602261925
        - name: metallb-operator
          defaultChannel: stable
          minVersion: 4.20.0-202602261925
          # maxVersion: 4.20.0-202602261925
        - name: multicluster-engine
          defaultChannel: stable-2.11
          minVersion: 2.11.0
          # maxVersion: 2.11.0
        - name: node-healthcheck-operator
          defaultChannel: stable
          minVersion: 0.10.3
          # maxVersion: 2.16.0
        - name: node-maintenance-operator
          defaultChannel: stable
          minVersion: 0.10.3
          # maxVersion: 0.10.3
        - name: self-node-remediation
          defaultChannel: stable
          minVersion: 0.11.1
          maxVersion: 0.11.1
        - name: web-terminal
          defaultChannel: fast
          minVersion: 1.15.0
          maxVersion: 1.15.0
    - catalog: registry.redhat.io/redhat/community-operator-index:v4.20
      packages:
        - name: group-sync-operator
          defaultChannel: alpha
          minVersion: 0.0.36
          maxVersion: 0.0.36
    - catalog: registry.redhat.io/redhat/certified-operator-index:v4.20
      packages:
        - name: dell-csm-operator-certified
          defaultChannel: stable
          minVersion: 1.11.2
          # maxVersion: 1.11.2
  additionalImages:
    - name: registry.redhat.io/ubi8/ubi:latest
    - name: registry.redhat.io/ubi9/ubi:latest
    - name: registry.redhat.io/ubi10/ubi:latest
    - name: ghcr.io/redhat-na-ssa/web-terminal-tooling:latest
    - name: registry.redhat.io/openshift4/ose-cli:latest
    # - name: ghcr.io/project-zot/zot:latest
    #  add any other images that you want from registry.redhat.io, quay.io, or your public registry
    #  to make them available in the disconnected environment.
